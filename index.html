<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b1b182eb96.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>LightBulb</title>
</head>
<body>

    <span id="clickAttempts">Number of Click Attempts: 0</span>

    <h2>LightBulb</h2>

    <div class="container">

        <i class="fa-regular fa-lightbulb" id="lightBulb"></i><br>

        <audio id="clickSound" src="mixkit-classic-click-1117.wav"></audio>

        <button id="onSwitch" onclick="turnOn()">Turn On</button>
        <button id="offSwitch" onclick="turnOff()">Turn Off</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
